<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E111C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club Lectura">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<title>Club de Lectura</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a book spine (sidebar) beside a reading room; tabs run like a film strip; figures are printed as cinema tickets */
:root{
  --bg:#ECE6DA; --surface:#FBF8F1; --sunk:#E2DACA; --line:#D3C8B3;
  --ink:#2A1F1B; --muted:#76695B; --accent:#7A2138; --accent-ink:#FBF1E2; --accent-soft:#F0DCDD;
  --gold:#A9822B; --spine:#5B1A2A; --spine-2:#4A1422; --spine-ink:#F1DFB8; --film:#221B18; --film-ink:#E9DCC6; --hole:#ECE6DA;
  --cloth-0:#6B1F32; --cloth-1:#2E5442; --cloth-2:#2B3A5C; --cloth-3:#8A5A1C; --cloth-4:#4F2F55; --cloth-5:#3F4A2A;
  --ok:#2E6B47; --ok-soft:#DCEBDD; --warn:#9A630F; --warn-soft:#F4E6C8; --bad:#B23A1E; --bad-soft:#F6DED5; --na:#857A6C; --na-soft:#E6DFD2;
  --f-display:"Young Serif", "Iowan Old Style", Georgia, serif;
  --f-label:"Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100E; --surface:#201916; --sunk:#2A211D; --line:#3D322C;
  --ink:#F1E6D4; --muted:#B4A390; --accent:#E39AAA; --accent-ink:#1C0E12; --accent-soft:#3D2128;
  --gold:#D8B25C; --spine:#3E111C; --spine-2:#320C16; --spine-ink:#E9CF92; --film:#0C0908; --film-ink:#E9DCC6; --hole:#4A3E36;
  --cloth-0:#5E1A2B; --cloth-1:#264638; --cloth-2:#24304D; --cloth-3:#6E4816; --cloth-4:#432749; --cloth-5:#353E22;
  --ok:#7BC793; --ok-soft:#1F3426; --warn:#E3B062; --warn-soft:#3B2E1A; --bad:#F08C72; --bad-soft:#43241C; --na:#A6998A; --na-soft:#2D2622; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100E; --surface:#201916; --sunk:#2A211D; --line:#3D322C;
  --ink:#F1E6D4; --muted:#B4A390; --accent:#E39AAA; --accent-ink:#1C0E12; --accent-soft:#3D2128;
  --gold:#D8B25C; --spine:#3E111C; --spine-2:#320C16; --spine-ink:#E9CF92; --film:#0C0908; --film-ink:#E9DCC6; --hole:#4A3E36;
  --cloth-0:#5E1A2B; --cloth-1:#264638; --cloth-2:#24304D; --cloth-3:#6E4816; --cloth-4:#432749; --cloth-5:#353E22;
  --ok:#7BC793; --ok-soft:#1F3426; --warn:#E3B062; --warn-soft:#3B2E1A; --bad:#F08C72; --bad-soft:#43241C; --na:#A6998A; --na-soft:#2D2622; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--sunk);color:var(--ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=month],input[type=number],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar > *{flex:0 1 auto}
.toolbar .grow{flex:1 1 220px}
.toolbar select,.toolbar input{width:auto}
.toolbar .grow input{width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.85rem;color:var(--muted)}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.club-row td{background:var(--sunk);font-family:var(--f-display);font-weight:700;font-size:.95rem}
tr.club-row td .muted{font-family:var(--f-body);font-weight:500;font-size:.85rem}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-weight:600;text-align:left}
.link:hover{color:var(--accent);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.m10{background:var(--accent-soft);color:var(--accent)}
.pill.m5{background:var(--na-soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.it{background:var(--accent-soft);color:var(--accent)}
.pill.na{background:var(--na-soft);color:var(--na)}
/* payments grid */
.pay th.m,.pay td.m{text-align:center;padding:4px 3px;width:44px}
.pay td.name{min-width:170px;white-space:nowrap}
.cell{width:38px;height:30px;border-radius:6px;border:1px dashed var(--line);background:transparent;cursor:pointer;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cell.pagado{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok)}
.cell.exento{background:var(--na-soft);border:1px solid var(--na-soft);color:var(--na)}
.cell.debe{background:var(--bad-soft);border:1px solid var(--bad-soft);color:var(--bad)}
.cell.futuro{opacity:.45}
.cell:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted);align-items:center}
.legend .cell{cursor:default;width:26px;height:20px}
/* months bar */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end}
.mbar{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:0;padding:4px 0;border-radius:8px}
.mbar:hover{background:var(--sunk)}
.mbar[aria-pressed="true"]{background:var(--accent-soft)}
.mbar .bars{height:110px;width:70%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:5px;overflow:hidden;background:var(--sunk)}
.mbar .b-pend{background:var(--warn)}
.mbar .b-done{background:var(--ok)}
.mbar .n{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.mbar .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].pend{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].done{background:var(--ok-soft);color:var(--ok)}
.seg button + button{border-left:1px solid var(--line)}
td input.inline{width:100%;min-width:140px;padding:5px 8px}
td input.cost{width:84px;min-width:84px;text-align:right}
.list{display:flex;flex-direction:column}
.list .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.list .row:last-child{border-bottom:0}
.list .row > div{min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.amt-in{color:var(--ok)} .amt-out{color:var(--bad)}
/* clubs */
.clubs{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.club{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.club .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.club .stats{display:flex;gap:12px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.club .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
/* modal */
.overlay{position:fixed;inset:0;background:rgb(10 10 20 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.form label.err input,.form label.err select{border-color:var(--bad)}
.radio{display:flex;gap:8px}
.radio label{flex:1;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink);font-size:.95rem}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio small{color:var(--muted);font-weight:500}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot .r{display:flex;gap:8px;margin-left:auto}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem}
.formerr{color:var(--bad);font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.status{padding:40px 16px;text-align:center;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 0 10px;flex-wrap:wrap}
.sec-head:first-child{margin-top:0}
@media (max-width:560px){ .form{grid-template-columns:1fr} .months .l{font-size:.62rem} .mbar .bars{height:80px} .kpi .val{font-size:1.4rem} }
/* shell + sidebar */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;padding-block:calc(26px + env(safe-area-inset-top,0px)) 24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;padding:0 12px;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);margin-top:2px}
.sidenav{display:flex;flex-direction:column;gap:4px}
.sidenav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:10px;font:600 .98rem var(--f-body);color:var(--muted);cursor:pointer;text-align:left}
.sidenav button:hover{background:var(--sunk);color:var(--ink)}
.sidenav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sidenav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell .wrap{width:100%}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));gap:10px}
  .brand{display:none}
  .sidenav{flex-direction:row;flex:1}
  .sidenav button{flex:1;justify-content:center;padding:9px 6px;font-size:.92rem}
}
/* activities */
.acts{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.act-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.act-card.fut{border-style:dashed}
.act-card.fut .stub{background:var(--sunk);color:var(--muted);border-right-color:var(--line)}
.act-card:hover{border-color:var(--accent)}
.act-card .date{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.act-card .figs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.88rem}
.act-card .figs b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.act-card .figs span{color:var(--muted)}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:10px}
.back:hover{color:var(--accent)}
.calc{display:flex;flex-direction:column;gap:12px}
.calc .inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.eq{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.eq .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.eq .row.total{border-bottom:0;font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.items td input{padding:5px 8px}
.items td.q input{width:64px;min-width:64px;text-align:right}
.items td.c input{width:90px;min-width:90px;text-align:right}
.items td.n input{min-width:150px}
.items tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 120px auto;max-width:640px;gap:8px;margin-top:12px}
.addrow input{width:100%}
@media (max-width:560px){.addrow{grid-template-columns:1fr 1fr}.addrow .btn,.addrow #ni-n{grid-column:1/-1}.calc .inputs{grid-template-columns:1fr}}
.parts-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.parts-add input{flex:1 1 220px;width:auto}
.sug{position:absolute;left:0;right:0;top:100%;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgb(0 0 0 / .18);max-height:280px;overflow:auto;margin-top:4px}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink);font:inherit}
.sug button:hover,.sug button:focus{background:var(--sunk)}
.sug small{color:var(--muted)}
th.grp{text-align:center;border-bottom:1px solid var(--line)}
td.sep,th.sep{border-left:1px solid var(--line)}

/* ===== Libros y películas ===== */
h1,h2,h3{font-weight:400;letter-spacing:0}
h1{font-size:1.9rem}
.kpi .lbl,th,.act-card .admit,.brand small,.club .stats,.legend,.pill{letter-spacing:.06em}
.kpi .lbl,th{font-family:var(--f-label);font-size:.98rem;font-weight:400;text-transform:uppercase;letter-spacing:.09em}
.kpi .val{font-family:var(--f-display);font-weight:400}
/* spine sidebar */
.side{background:
   repeating-linear-gradient(90deg,rgb(0 0 0 / .05) 0 1px,transparent 1px 4px),
   linear-gradient(90deg,var(--spine-2),var(--spine) 18%,var(--spine) 82%,var(--spine-2));
  border-right:0;color:var(--spine-ink)}
.side::before,.side::after{content:"";display:block;height:7px;margin:0 6px;border-top:2px solid var(--gold);border-bottom:1px solid var(--gold);opacity:.85;flex:none}
.side::after{margin-top:auto}
.brand{font-family:var(--f-display);font-weight:400;font-size:1.35rem;text-align:center;color:var(--spine-ink);padding:14px 8px;border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);outline:1px solid color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:3px;margin:4px 8px}
.brand small{font-family:var(--f-label);font-size:.85rem;color:var(--gold);text-transform:uppercase;margin-top:4px}
.sidenav button{color:color-mix(in srgb,var(--spine-ink) 72%,transparent);font-family:var(--f-label);font-size:1.25rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;border-radius:3px;padding:9px 14px}
.sidenav button:hover{background:rgb(255 255 255 / .06);color:var(--spine-ink)}
.sidenav button[aria-current="page"]{background:rgb(0 0 0 / .22);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 70%,transparent)}
@media (max-width:860px){.side::before,.side::after{display:none}.sidenav{overflow-x:auto;scrollbar-width:none}.sidenav button{font-size:1.05rem;letter-spacing:.05em;padding:8px 4px;gap:6px}}
@media (max-width:440px){.sidenav svg{display:none}}
/* film strip tabs */
nav.tabs{background:var(--film);border-bottom:0;border-radius:4px;padding:15px 10px;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:22px}
nav.tabs::before,nav.tabs::after{content:"";position:absolute;left:6px;right:6px;height:6px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--hole) 0 9px,transparent 9px 20px);border-radius:1px;opacity:.9}
nav.tabs::before{top:4px} nav.tabs::after{bottom:4px}
nav.tabs{position:sticky}
nav.tabs button{color:color-mix(in srgb,var(--film-ink) 70%,transparent);border-radius:2px;font-family:var(--f-label);font-size:1.15rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;padding:5px 16px;border:1px solid color-mix(in srgb,var(--film-ink) 18%,transparent)}
nav.tabs button[aria-selected="true"]{background:var(--film-ink);color:var(--film);border-color:var(--film-ink)}
nav.tabs button:hover:not([aria-selected="true"]){background:rgb(255 255 255 / .08);color:var(--film-ink)}
/* ticket figures */
.kpi{position:relative;border-radius:6px;border:1px solid var(--line);padding:16px 22px;background:var(--surface)}
.kpi::before,.kpi::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.kpi::before{left:-10px;clip-path:inset(0 0 0 50%)}
.kpi::after{right:-10px;clip-path:inset(0 50% 0 0)}
.kpi .lbl{color:var(--accent);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:4px}
/* panels like pages */
.panel{border-radius:6px;box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--surface),0 4px 0 -1px var(--line)}
.btn{border-radius:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scroll{border-radius:6px}
tr.club-row td{font-family:var(--f-display);font-weight:400;font-size:1rem;background:var(--sunk)}
/* clubs as book covers */
.club{padding:0;overflow:hidden;gap:0;border-radius:4px 8px 8px 4px;border-left:7px solid color-mix(in srgb,var(--cloth) 70%,#000)}
.club .head{background:var(--cloth);color:#F3E2BC;padding:18px 14px 16px;position:relative;flex-direction:column;align-items:center;text-align:center;gap:2px}
.club .head::before{content:"";position:absolute;inset:6px;border:1px solid rgb(232 200 128 / .75);outline:1px solid rgb(232 200 128 / .4);outline-offset:-4px;pointer-events:none}
.club .head h3{font-size:1.3rem;color:#F3E2BC}
.club .head .muted{color:rgb(243 226 188 / .75)!important;font-family:var(--f-label);letter-spacing:.12em;font-size:.95rem!important}
.club .stats{padding:12px 14px 0;justify-content:center}
.club .acts{padding:12px 14px 14px;justify-content:center}
/* activities as cinema tickets */
.act-card{flex-direction:row;padding:0;gap:0;border-radius:6px;position:relative;overflow:visible}
.act-card .stub{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--accent);color:var(--accent-ink);border-radius:5px 0 0 5px;padding:12px 6px;border-right:2px dashed color-mix(in srgb,var(--accent-ink) 55%,transparent)}
.act-card .stub .d{font-family:var(--f-display);font-size:2rem;line-height:1}
.act-card .stub .m,.act-card .stub .y{font-family:var(--f-label);letter-spacing:.12em;font-size:1.05rem;line-height:1.1}
.act-card .stub .y{opacity:.75;font-size:.9rem}
.act-card .body{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.act-card .admit{font-family:var(--f-label);color:var(--accent);font-size:.95rem;letter-spacing:.14em}
.act-card::before,.act-card::after{content:"";position:absolute;left:79px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.act-card::before{top:-9px;clip-path:inset(50% 0 0 0)}
.act-card::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.act-card:hover{border-color:var(--accent);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.act-card:hover{transform:none}}
/* books chart as spines */
.mbar .bars{border-radius:2px 2px 0 0;width:62%}
.mbar .b-done,.mbar .b-pend{box-shadow:inset 0 3px 0 rgb(255 255 255 / .18),inset 0 -3px 0 rgb(0 0 0 / .15)}
.toast{border-radius:4px;font-family:var(--f-label);letter-spacing:.08em;font-size:1.05rem;font-weight:400}
.modal{border-radius:8px}
.modal .head h2{font-size:1.45rem}

/* scope switch: index tabs of a ledger */
.scope{display:flex;gap:4px;margin:0 0 -1px;padding-left:4px;overflow-x:auto;scrollbar-width:none}
.scope button{border:1px solid var(--line);border-bottom:0;background:var(--sunk);color:var(--muted);font:400 1.05rem var(--f-display);padding:9px 18px 8px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.scope button small{font-family:var(--f-label);font-size:.95rem;letter-spacing:.08em;margin-left:6px;color:inherit;opacity:.8}
.scope button[aria-pressed="true"]{background:var(--film);color:var(--film-ink);border-color:var(--film)}
.ap-in{width:92px;min-width:92px;text-align:right;padding:5px 8px}
.ap-def{font-size:.78rem;color:var(--muted)}
.enc-tag{font-family:var(--f-label);letter-spacing:.08em;font-size:.95rem;color:rgb(243 226 188 / .85)}
.split{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--sunk);margin-top:6px}
.split .me{background:var(--accent)} .split .enc{background:var(--gold)}

.hero{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpi .val{font-size:2.2rem;line-height:1.1}
.kpi.big .val{font-size:2.3rem}
.kpi .of{font-size:.9rem;color:var(--muted)}
.kpi .prog,.scroll .prog{display:block}
td .prog{height:5px;margin-top:4px;min-width:90px}
.prog{height:8px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;background:var(--ok)}
.kpi.total{background:var(--film);color:var(--film-ink);border-color:var(--film)}
.kpi.total .lbl{color:var(--gold);border-color:rgb(255 255 255 / .15)}
.kpi.total .sub,.kpi.total .of{color:color-mix(in srgb,var(--film-ink) 70%,transparent)}
.kpi.total .prog{background:rgb(255 255 255 / .12)}
.kpi.total::before,.kpi.total::after{border-color:var(--film)}
tr.pre td{color:var(--muted)}
tr.pre td b{color:var(--muted)}
.tag{font-family:var(--f-label);letter-spacing:.08em;font-size:.85rem;color:var(--muted);margin-left:6px}
.bmcard{padding:0;overflow:hidden}
.bmcard .bmhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.bmcard .bmhead h3{font-size:1.2rem}
.bmcard .bmhead .meta{color:var(--muted);font-size:.88rem}
.bmcard table{border:0}
.bmcard .scroll{border:0;border-radius:0}
.gasto-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gasto-in input{width:120px;text-align:right}

.cell.usd{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent)}
.fxrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.fxrow:last-child{border-bottom:0}
.fxrow > div{min-width:0}
.fxsec{padding:0;overflow:hidden}
.fxsec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--sunk);font-family:var(--f-display);font-size:1.1rem}
.fxsec summary::-webkit-details-marker{display:none}
.fxsec summary::after{content:"＋";font-family:var(--f-body);color:var(--muted)}
.fxsec[open] summary::after{content:"−"}
.fxsec .inner{padding:4px 16px 12px}
.fxsec .clubh{font-family:var(--f-label);letter-spacing:.08em;color:var(--accent);font-size:1rem;margin-top:10px}
.rate-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.rate-form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.tag-auto{font-family:var(--f-label);letter-spacing:.08em;font-size:.85rem;padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.tag-man{font-family:var(--f-label);letter-spacing:.08em;font-size:.85rem;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
:root{--clubbar:color-mix(in srgb,#D8B25C 30%,var(--surface));--clubbar-ink:#5E4512;--clubbar-sub:rgb(94 69 18 / .75)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--clubbar:color-mix(in srgb,#D8B25C 16%,var(--surface));--clubbar-ink:#D8B25C;--clubbar-sub:rgb(216 178 92 / .7)}}
:root[data-theme="dark"]{--clubbar:color-mix(in srgb,#D8B25C 16%,var(--surface));--clubbar-ink:#D8B25C;--clubbar-sub:rgb(216 178 92 / .7)}
tr.club-row td{background:var(--clubbar);color:var(--clubbar-ink);border-top:0;border-bottom:0}
tr.club-row td .muted{color:var(--clubbar-sub)}
tr.club-row td:first-child{box-shadow:inset 3px 0 0 #D8B25C}
.fxsec .clubh{background:var(--clubbar);color:var(--clubbar-ink);border-top:0;padding:6px 10px;margin:12px -6px 2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.abonos{border-top:1px dashed var(--line);margin-top:4px;padding:10px 16px 14px}
.abh{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.abrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--line)}
.abrow .grow{flex:1}
.abform{display:grid;grid-template-columns:minmax(90px,1fr) minmax(110px,1fr) minmax(140px,1fr);gap:8px;margin-top:10px;align-items:end}
.abform label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.abform label.err input{border-color:var(--bad)}
.abbtns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
label.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px}
label.chk input{width:auto}
@media (max-width:560px){.abform{grid-template-columns:1fr 1fr}}
.topbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn.green{background:var(--ok);border-color:var(--ok);color:var(--ok-ink);display:inline-flex;align-items:center;gap:6px}
.btn.green:hover:not(:disabled){filter:brightness(1.08)}
.btn.green svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root{--ok-ink:#F4FBF6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok-ink:#10241A}}
:root[data-theme="dark"]{--ok-ink:#10241A}
.hero3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.hero3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.hero3{grid-template-columns:1fr}}
.kpi.k-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.kpi.k-bad .val{color:var(--bad)}
.kpi.k-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.kpi.k-ok .val{color:var(--ok)}
td.g-bad,th.g-bad{background:var(--bad-soft)!important;color:var(--bad)}
td.g-bad b,td.g-bad span{color:var(--bad)}
td.g-ok,th.g-ok{background:var(--ok-soft)!important;color:var(--ok)}
td.g-ok b{color:var(--ok)}
.kpi.src{display:flex;flex-direction:column}
.sub.falta{color:var(--warn)!important}
.sub.falta b{color:var(--warn)}
.sub.falta.ok{color:var(--ok)!important}
.addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.addrow label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.addrow .btn{justify-self:start;height:38px}
input[data-climonto]{max-width:120px;margin-left:auto;display:block}
.kpi.k-fx{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.kpi.k-fx .val{color:var(--gold)}
.sub.fx-ex{color:var(--gold)!important;font-weight:600}
.kpi .pair>span{white-space:nowrap}
.kpi .pair{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.85rem;color:var(--muted);padding:3px 0}
.kpi .pair b{font-size:1.15rem;color:var(--ink)}
.kpi .pair.real{border-top:1px dashed var(--line);margin-bottom:4px}
.kpi .pair.real b{font-size:1.3rem;font-family:var(--f-display)}
.kpi.k-fx{background:color-mix(in srgb,#D8B25C 22%,var(--surface))!important}

/* actividades finalizadas */
.seg button[aria-pressed="true"].fin{background:var(--clubbar);color:var(--clubbar-ink)}
.seg button[aria-pressed="true"]:not(.pend):not(.done):not(.fin){background:var(--sunk);color:var(--ink)}
.act-card.fin{opacity:.92}
.act-card.fin .stub{background:var(--na-soft);color:var(--ink);border-right-color:var(--line)}
.act-card.fin .admit{color:var(--muted)}
.note.fin-note{background:var(--na-soft);color:var(--ink)}
/* color de la fecha según estado */
.act-card .stub{background:#2F7A4D;color:#F4FBF6;border-right-color:rgb(244 251 246 / .55)}
.act-card.fut .stub{background:#D8B25C;color:#2A1F1B;border-right-color:rgb(42 31 27 / .45)}
.act-card.fin .stub{background:#B23A1E;color:#FBEDE8;border-right-color:rgb(251 237 232 / .55)}
.act-card .stub .y{opacity:.85}
/* calendario */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{flex:1;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .dw{text-align:center;font-family:var(--f-label);letter-spacing:.08em;color:var(--muted);font-size:.95rem;padding:2px 0}
.cd{min-height:48px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 0 4px;cursor:pointer;color:var(--ink);font:inherit}
.cd.empty{border:0;background:transparent;cursor:default}
.cd .n{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}
.cd.has{background:var(--sunk)}
.cd.today{border-color:var(--accent);border-width:2px}
.cd.today .n{color:var(--accent)}
.cd.sel{background:var(--accent);border-color:var(--accent)}
.cd.sel .n{color:var(--accent-ink)}
.dots{display:flex;gap:3px;min-height:7px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.book{background:#D8B25C}.dot.it{background:#E39AAA}.dot.otro{background:#7BB0D8}
.legend .dot{margin-right:4px;vertical-align:middle}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:5px solid #D8B25C;border-radius:6px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.ev.ev-it{border-left-color:#E39AAA}.ev.ev-otro{border-left-color:#7BB0D8}
.ev.past{opacity:.6}
.ev:hover{border-color:var(--accent)}
.ev-when{flex:none;width:76px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.ev-when b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1.1}
.ev-when small{color:var(--muted);font-size:.78rem;text-transform:capitalize}
.ev-h{font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.ev-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-tag{font-family:var(--f-label);letter-spacing:.1em;font-size:.9rem;color:var(--accent)}
.ev-t{font-size:1rem}
.ev-sub{font-size:.88rem;overflow-wrap:anywhere}
/* ===== App móvil (PWA) ===== */
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
input,select,textarea{font-size:16px!important}
.btn,.seg button,.link,.cell,.sidenav button,nav.tabs button,summary{touch-action:manipulation}
.shell,.wrap{overflow-x:clip}
.safe-top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:16}
.respaldo h2{margin-bottom:6px}
.respaldo .acts-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn.big{min-height:48px;padding:12px 18px;font-size:1rem}
.filebtn{display:inline-flex;align-items:center;justify-content:center}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.counts div{background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:.88rem;color:var(--muted)}
.counts b{display:block;font-size:1.2rem;color:var(--ink);font-family:var(--f-display);font-weight:400}
.respaldo .pill{white-space:normal;line-height:1.35}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:.9rem}
@media (max-width:860px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:15;height:auto;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
    border-top:1px solid color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 -6px 18px rgb(0 0 0 / .25)}
  .sidenav{gap:2px;overflow:visible}
  .sidenav button{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;font-size:.84rem;letter-spacing:.04em;padding:6px 2px;min-height:54px;line-height:1.05;text-align:center;white-space:normal}
  .sidenav svg{display:block!important;width:22px;height:22px}

  .btn{min-height:44px;padding:9px 14px}

  .topbtns .btn{flex:1 1 auto;justify-content:center}

}
</style>

try{const t=localStorage.getItem('cl-tab'); if(t) S.tab=({pagos:'cuotas',finanzas:'resumen'})[t]||t; const sc=localStorage.getItem('cl-sec'); if(sc) S.section=sc; const sp=localStorage.getItem('cl-scope'); if(sp) S.scope=sp; const pt=localStorage.getItem('cl-ptab'); if(pt) S.payTab=pt; const itt=localStorage.getItem('cl-ittab'); if(itt) S.itTab=itt; if(S.tab==='aportes'){S.section='pagos';S.payTab='bm';S.tab='resumen';}}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const v=Math.round((n||0)*100)/100;return (v<0?'−$':'$')+Math.abs(v).toLocaleString('es-VE',{minimumFractionDigits:0,maximumFractionDigits:2});};
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n;};
const dec=v=>(v===null||v===undefined||v==='')?'':String(v).replace('.',',');

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
/* distance of query q (normalized) to text: 0 = contains; otherwise sum of best per-word typo distances */
function fuzzyScore(text,q){
  const t=norm(text); if(!q) return 0; if(t.includes(q)) return 0;
  const tt=t.split(/[^a-z0-9@.]+/).filter(Boolean), qt=q.split(' ').filter(Boolean); let tot=0, worst=0;
  for(const w of qt){let best=99; for(const x of tt){ if(x.startsWith(w)){best=0;break;} const d=Math.min(lev(w,x),lev(w,x.slice(0,w.length))); if(d<best)best=d; } tot+=best; worst=Math.max(worst,best/Math.max(1,w.length));}
  return tot+worst;
}
const fuzzyLimit=q=>{const L=q.replace(/ /g,'').length;return L<=3?0.01:L<=6?1.4:2.6;};
/* returns matching items; if none, the closest ones (flag .approx) */
function searchList(list,textFn,qRaw,maxApprox){
  const q=norm(qRaw); if(!q){const r=list.slice();r.approx=false;return r;}
  const scored=list.map(x=>({x,sc:fuzzyScore(textFn(x),q)}));
  const lim=fuzzyLimit(q); let hit=scored.filter(o=>o.sc<=lim).sort((a,b)=>a.sc-b.sc).map(o=>o.x);
  let approx=false;
  if(!hit.length&&list.length){approx=true; hit=scored.sort((a,b)=>a.sc-b.sc).slice(0,maxApprox||5).map(o=>o.x);}
  hit.approx=approx; return hit;
}
const approxNote=(arr,q)=>arr&&arr.approx?`<p class="note" style="margin:0 0 10px">No encontré “${esc(q)}” exacto. Te muestro los nombres más parecidos.</p>`:'';

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

/* one write at a time per document */
const chains={};
function write(path,fn){
  const p=(chains[path]||Promise.resolve()).then(fn).catch(e=>{
    console.error(e);
    if(e&&e.code==='invalid_argument'){S.canWrite=false;toast('No tienes permiso para modificar estos datos');render();}
    else if(e&&e.code==='quota_exceeded') toast('La base de datos está llena: elimina registros antiguos');
    else toast('No se pudo guardar en el teléfono. Inténtalo de nuevo.');
    throw e;});
  chains[path]=p.catch(()=>{});return p;
}

/* ---------- config ---------- */
const INICIO=()=>S.config.inicio||'2026-10';
const fmtK=k=>`${MES[+k.slice(5,7)-1].toLowerCase()} ${k.slice(0,4)}`;
const fmtDay=f=>{if(!f)return '';const [y,m,d]=f.split('-').map(Number);return `${d} ${MES[m-1].slice(0,3).toLowerCase()}`;};
let cfgPending=null;
function saveConfig(patch){
  if(!S.canWrite) return;
  for(const [f,v] of Object.entries(patch)) S.config[f]=(v&&typeof v==='object'&&!Array.isArray(v))?{...(S.config[f]||{}),...v}:v;
  cfgPending={...S.config};
  clearTimeout(timers.cfg);
  timers.cfg=setTimeout(()=>{const body=cfgPending; if(!body) return; write('config/general',()=>S.db.doc('config/general').set(body)).then(()=>{if(cfgPending===body) cfgPending=null;}).catch(()=>{});},600);
}

/* ---------- club ownership ---------- */
const isEnc=c=>!!c&&c.tipo==='encargada';
const clubById=id=>S.clubs.find(c=>c.id===id);
let LEADER='Yo';
const bmName=b=>b===LEADER?'Yo':b;
const bmOf=c=>((c&&c.encargada)||'').trim();
const bmSort=(a,b)=>a===b?0:a===LEADER?-1:b===LEADER?1:a.localeCompare(b,'es');
const isIt=c=>!!c&&c.area==='it';
const scopeClubs=()=>S.clubs.filter(c=>!isIt(c)).sort((a,b)=>cmpEs(a.nombre,b.nombre));
const clubLabel=id=>{const c=clubById(id);return c?`${c.nombre} - ${bmName(bmOf(c))||'Sin bookmommy'}`:'Sin club';};
const memberBm=m=>(m.bookmommy||'').trim()||bmOf(clubById(m.club));
function bookmommies(){const set=new Set([LEADER,...(S.config.bookmommies||[])]);for(const c of S.clubs){if(isIt(c))continue;const b=bmOf(c);if(b)set.add(b);}return [...set].sort(bmSort);}
function mommies(){const set=new Set([LEADER,...(S.config.mommies||[])]);for(const c of S.clubs){if(!isIt(c))continue;const b=bmOf(c);if(b)set.add(b);}return [...set].sort(bmSort);}
const itClubList=()=>S.clubs.filter(isIt).sort((a,b)=>cmpEs(a.nombre,b.nombre));
const itLabel=id=>{const c=clubById(id);return c?`${c.nombre} - ${bmName(bmOf(c))||'Sin mommy'}`:'Sin club';};
function itMems(){const out=[];for(const m of S.allMembers){for(const [cid,mem] of Object.entries(m.itClubs||{})){if(mem&&clubById(cid))out.push({m,cid,mem});}}return out;}
function pState(pagos,desde,y,mo){const k=mkey(y,mo);const v=(pagos||{})[k];if(v==='pagado'||v==='exento')return v;if(k<(desde||'2000-01'))return 'antes';if(k>curKey)return 'futuro';return 'debe';}
function pDebt(pagos,desde,amt){const out=[];const d=desde||curKey;let y=+d.slice(0,4),mo=+d.slice(5,7),g=0;while(mkey(y,mo)<=curKey&&g++<120){if(pState(pagos,desde,y,mo)==='debe')out.push(mkey(y,mo));mo++;if(mo>12){mo=1;y++;}}return {months:out,amount:out.length*(+amt||0)};}
function itMonth(y,mo){
  const k=mkey(y,mo), byC={};
  for(const r of itMems()){const st=pState(r.mem.pagos,r.mem.desde,y,mo), amt=+r.mem.cuota||0, b=byC[r.cid]||(byC[r.cid]={esp:0,cob:0,n:0,deben:0}); b.n++;
    if(st==='antes')continue; if(st!=='exento')b.esp+=amt; if(st==='pagado')b.cob+=amt; if(st==='debe')b.deben++;}
  const rows=[]; let propEsp=0,propReal=0;
  for(const c of itClubList()){const b=byC[c.id]||{esp:0,cob:0,n:0,deben:0};
    if(isEnc(c)){ if(k<(c.desde||'2000-01')) continue; const a=aporteFor(c,k), custom=(c.aportes||{})[k]!=null&&(c.aportes||{})[k]!=='';
      rows.push({c,a,custom,info:aporteInfo(c,k),cobrado:b.cob,esperado:b.esp,enc:b.cob-a,rec:false,n:b.n}); }
    else {propEsp+=b.esp; propReal+=b.cob;} }
  const sum=f=>rows.reduce((t,r)=>t+f(r),0);
  const total=sum(r=>r.a);
  const R=withAbonos({k,rows,byC,propEsp,propReal,total,cobrado:sum(r=>r.cobrado),esperado:sum(r=>r.esperado),enc:sum(r=>r.enc)},'it');
  R.esp=propEsp+total; R.real=propReal+R.recibido; return R;
}
const inScope=()=>true;
const sinAporte=c=>!!c&&c.modoAporte==='ninguno';
const activeIn=(pagos,desde,k)=>{const st=pState(pagos,desde,+k.slice(0,4),+k.slice(5,7));return st!=='antes'&&st!=='exento';};
function aporteInfo(c,k){
  if(isIt(c)){const rs=itMems().filter(r=>r.cid===c.id&&activeIn(r.mem.pagos,r.mem.desde,k));const esp=rs.reduce((t,r)=>t+(+r.mem.cuota||0),0),n=rs.length,prom=n?esp/n:0;
    return {it:true,n,prom,auto:sinAporte(c)?0:Math.min(esp,2*prom)};}
  const n10=S.members.filter(m=>m.club===c.id&&+m.membresia===10&&activeIn(m.pagos,m.desde,k)).length;
  return {it:false,n10,auto:sinAporte(c)?0:10+5*n10};
}
const aporteAuto=(c,k)=>aporteInfo(c,k).auto;
function aporteFor(c,k){const v=(c.aportes||{})[k];return (v===null||v===undefined||v==='')?aporteAuto(c,k):+v;}
const bmKey=c=>((c&&c.encargada)||'').trim()||'Sin asignar';
const abonosOf=(area,persona,k)=>S.abonos.filter(a=>(a.area||'book')===area&&a.persona===persona&&a.mes===k).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
function withAbonos(res,area){
  const byP={};
  for(const r of res.rows){const p=bmKey(r.c);(byP[p]||(byP[p]={total:0,abonado:0})).total+=r.a;}
  for(const a of S.abonos){if((a.area||'book')!==area||a.mes!==res.k)continue;(byP[a.persona]||(byP[a.persona]={total:0,abonado:0})).abonado+=+a.monto||0;}
  let recibido=0,pendiente=0;for(const v of Object.values(byP)){recibido+=v.abonado;pendiente+=Math.max(0,v.total-v.abonado);}
  for(const r of res.rows){const v=byP[bmKey(r.c)];r.rec=v.total>0&&v.abonado>=v.total-0.005;}
  return {...res,area,byP,recibido,pendiente};
}
function aportesMonth(y,mo){
  const k=mkey(y,mo); const rows=[];
  for(const c of S.clubs){
    if(!isEnc(c)||isIt(c)||k<(c.desde||'2000-01')) continue;
    const ms=S.members.filter(m=>m.club===c.id);
    const cobrado=ms.filter(m=>(m.pagos||{})[k]==='pagado').reduce((t,m)=>t+(+m.membresia||0),0);
    const esperado=ms.reduce((t,m)=>t+(+m.membresia||0),0);
    const a=aporteFor(c,k); const custom=(c.aportes||{})[k]!=null&&(c.aportes||{})[k]!=='';

  }
  const sum=f=>rows.reduce((t,r)=>t+f(r),0);
  return withAbonos({k,rows,total:sum(r=>r.a),cobrado:sum(r=>r.cobrado),esperado:sum(r=>r.esperado),enc:sum(r=>r.enc)},'book');
}
const pendingClub={};
function patchClub(id,patch){
  const c=clubById(id); if(!c||!S.canWrite) return;
  for(const [f,v] of Object.entries(patch)) c[f]=(v&&typeof v==='object'&&!Array.isArray(v))?{...(c[f]||{}),...v}:v;

/* ---------- payments logic ---------- */
function payState(m,y,mo){
  const k=mkey(y,mo); const v=(m.pagos||{})[k];
  if(v==='pagado'||v==='exento') return v;
  const desde=m.desde||'2000-01';
  if(k<desde) return 'antes';
  if(k>curKey) return 'futuro';
  return 'debe';
}
function debt(m){ // all owed months up to now, any year since desde
  const out=[]; const d=(m.desde||curKey);
  let y=+d.slice(0,4), mo=+d.slice(5,7);
  let guard=0;
  while(mkey(y,mo)<=curKey && guard++<120){
    if(payState(m,y,mo)==='debe') out.push(mkey(y,mo));
    mo++; if(mo>12){mo=1;y++;}
  }
  return {months:out,amount:out.length*(+m.membresia||0)};
}
function bookFor(m,y){return S.books[`${m.id}--${y}`]||null;}
function bookState(m,y){const b=bookFor(m,y);return b&&b.estado==='comprado'?'comprado':'pendiente';}

/* ---------- finance ---------- */
function monthFin(y,mo){
  const k=mkey(y,mo);
  let cuotas=0; for(const m of S.members){ if((m.pagos||{})[k]==='pagado'&&!isEnc(clubById(m.club))) cuotas+=+m.membresia||0; }
  const ap=k<=curKey?aportesMonth(y,mo):{total:0,recibido:0,rows:[],byP:{}};
  let nComp=0, nPend=0;
  for(const m of S.members){ if(+m.membresia!==10||bMonth(m)!==mo) continue;
    if(bookState(m,y)==='comprado') nComp++; else nPend++;
  }
  const librosComprados=gastoLibros(k), librosPend=0, costoSinPrecio=0;
  const mv=S.movs.filter(x=>x.mes===k);
  const otrosIn=mv.filter(x=>x.tipo==='ingreso').reduce((a,x)=>a+(+x.monto||0),0);
  const otrosOut=mv.filter(x=>x.tipo==='egreso').reduce((a,x)=>a+(+x.monto||0),0);
  const ingresos=cuotas+ap.recibido+otrosIn, egresos=librosComprados+otrosOut;
  return {k,cuotas,aportes:ap.total,aportesRec:ap.recibido,aportesN:ap.rows.length,aportesRecN:ap.rows.filter(r=>r.rec).length,otrosIn,otrosOut,librosComprados,librosPend,nComp,nPend,costoSinPrecio,ingresos,egresos,balance:ingresos-egresos,proyectado:ingresos-egresos-librosPend,movs:mv};
}

  const ae=document.activeElement, aid=ae&&ae.id, isTxt=ae&&ae.tagName==='INPUT'&&/^(text|search|email|tel)$/.test(ae.type);

function actCalc(a){

  const sub=i=>(+i.cantidad||0)*(+i.costo||0);
  const presupuesto=items.reduce((t,i)=>t+sub(i),0);
  const gastado=items.filter(i=>i.comprado).reduce((t,i)=>t+sub(i),0);
  const precio=+a.precio||0;
  const parts=a.participantes||[];
  const pagadas=parts.filter(p=>p.pagado).length;
  const esperadas=(a.esperadas!==null&&a.esperadas!==undefined&&a.esperadas!=='')?+a.esperadas:parts.length;
  const ingresoEsperado=precio*esperadas;
  const cobrado=precio*pagadas;
  return {items,sub,presupuesto,gastado,falta:presupuesto-gastado,precio,parts,pagadas,esperadas,ingresoEsperado,
    gananciaEsperada:ingresoEsperado-presupuesto,cobrado,porCobrar:precio*(parts.length-pagadas),gananciaReal:cobrado-gastado,
    equilibrio:precio>0?Math.ceil(presupuesto/precio):null,precioMin:esperadas>0?presupuesto/esperadas:null};

function bmGroups(ap){
  const map=new Map();
  for(const r of ap.rows){const n=bmKey(r.c); if(!map.has(n)) map.set(n,[]); map.get(n).push(r);}
  return [...map.entries()].map(([name,rows])=>{rows.sort((a,b)=>cmpEs(a.c.nombre,b.c.nombre));const sum=f=>rows.reduce((t,r)=>t+f(r),0);
    const total=sum(r=>r.a), rec=((ap.byP||{})[name]||{}).abonado||0;
    const st=total===0?(rec>0?'ok':'none'):rec>=total-0.005?'ok':rec>0?'part':'pend';
    return {name,rows,total,rec,pend:Math.max(0,total-rec),abonos:abonosOf(ap.area||'book',name,ap.k),cobrado:sum(r=>r.cobrado),esperado:sum(r=>r.esperado),enc:sum(r=>r.enc),n:sum(r=>r.n),st};})
    .sort((a,b)=>a.name==='Sin asignar'?1:b.name==='Sin asignar'?-1:a.name.localeCompare(b.name,'es'));
}

const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const bs=n=>'Bs '+(+n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:4});
const eur=n=>{const v=Math.round((n||0)*100)/100;return (v<0?'−€':'€')+Math.abs(v).toLocaleString('es-VE',{minimumFractionDigits:0,maximumFractionDigits:2});};
const longDate=f=>{if(!f)return '';const [y,m,d]=f.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
const validRates=()=>S.tasas.filter(t=>+t.eur>0&&+t.usd>0);
function rateFor(f){const v=validRates(); if(!v.length) return null; for(const t of v){ if(t.fecha<=f) return t; } return v[v.length-1];}
const monthEnd=k=>{const y=+k.slice(0,4),m=+k.slice(5,7);const e=`${k}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;const t=todayStr();return e<t?e:t;};

  for(const r of itMems()){const c=clubById(r.cid); if(isEnc(c)) continue; if((r.mem.pagos||{})[k]==='pagado') out.push({grp:'it',amt:+r.mem.cuota||0,met:(r.mem.metodos||{})[k]||'bs',fecha:(r.mem.fechasPago||{})[k]});}
  {const V=vinMonth(y,mo); for(const r of V.cli) if(r.cob&&r.monto>0) out.push({grp:'vin',amt:r.monto,met:'usd',fecha:r.d&&r.d.fecha}); for(const p of V.proj) if(p.estado==='cobrado'&&+p.monto>0) out.push({grp:'vin',amt:+p.monto,met:'usd',fecha:p.fecha});}
  for(const a of S.abonos) if(a.mes===k&&+a.monto>0) out.push({grp:(a.area||'book')==='it'?'mo':'bm',amt:+a.monto,met:a.metodo==='usd'?'usd':'bs',fecha:a.fecha});

function fxSummary(y,mo){

const pendingAct={};
function saveAct(id,patch,now){
  const a=S.acts.find(x=>x.id===id); if(!a||!S.canWrite) return;
  const doc={...a,...patch}; delete doc.id;
  Object.assign(a,patch); pendingAct[id]={...doc};
  if(now) render();
  const go=()=>{const body=pendingAct[id]; if(!body) return; write('activities/'+id,()=>S.db.doc('activities/'+id).set(body)).then(()=>{if(pendingAct[id]===body) delete pendingAct[id];}).catch(()=>{});};
  clearTimeout(timers['act'+id]);
  if(now) go(); else timers['act'+id]=setTimeout(go,600);
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addItem(){
  const a=curAct(); if(!a) return;

  if(!nombre){toast('Escribe el nombre del artículo');$('#ni-n').focus();return;}
  saveAct(a.id,{items:[...(a.items||[]),{id:uid(),nombre,cantidad,costo,comprado:false}]},true);
  setTimeout(()=>{const n=$('#ni-n');if(n)n.focus();},0);
}
function showSug(boxId,val,attr){
  const box=document.getElementById(boxId); if(!box) return;
  const q=norm(val); if(!q){box.hidden=true;box.innerHTML='';return;}
  const res=searchList(S.allMembers,m=>full(m),val,6).slice(0,8);
  box.innerHTML=(res.approx?'<div class="hint" style="padding:6px 12px">Más parecidas:</div>':'')+res.map(m=>`<button type="button" data-${attr}="${esc(m.id)}">${esc(full(m))} <small>· ${esc(m.club?clubLabel(m.club):'The It Club')}</small></button>`).join('')+(attr==='pickpart'?`<div class="hint" style="padding:6px 12px">¿No está? Pulsa “Inscribir” para agregar “${esc(val.trim())}” como nombre nuevo.</div>`:'');
  box.hidden=false;

function addPartMember(mid){
  const a=curAct(); const m=S.allMembers.find(x=>x.id===mid); if(!a||!m) return;

  if(parts.some(p=>p.memberId===m.id)){toast(full(m)+' ya está inscrita');return;}

function cyclePay(id,k){
  const m=S.members.find(x=>x.id===id);if(!m||!S.canWrite)return;
  const cur=(m.pagos||{})[k]||null;
  const next=cur===null?'pagado':cur==='pagado'?'exento':null;
  // optimistic
  const upd={pagos:{[k]:next}};
  if(next==='pagado'&&(!m.desde||k<m.desde)) upd.desde=k;
  m.pagos={...(m.pagos||{}),[k]:next}; if(upd.desde) m.desde=upd.desde; render();
  write('members/'+id,()=>S.db.doc('members/'+id).update(upd)).catch(()=>{});
}
function saveBook(memberId,patch){
  const y=S.year, id=`${memberId}--${y}`;
  const prev=S.books[id]||{memberId,anio:y,titulo:'',estado:'pendiente',costo:null};
  const doc={...prev,...patch};
  S.books[id]=doc; if(patch.estado) render();
  return write('books/'+id,()=>S.db.doc('books/'+id).set(doc));
}

function fmtPhone1(raw){let d=String(raw).replace(/\D/g,'');
  if(String(raw).trim().startsWith('+')&&!d.startsWith('58'))return null;
  if(d.length===12&&d.startsWith('58'))d='0'+d.slice(2);
  if(d.length===10&&/^[24]/.test(d))d='0'+d;
  return d.length===11&&/^0[24]/.test(d)?`(${d.slice(0,4)}) ${d.slice(4,7)}-${d.slice(7)}`:null;}
function fmtPhones(txt){return String(txt||'').replace(/\+?\(?[\d][\d\s().\-]{8,}\d/g,mt=>fmtPhone1(mt)||mt).trim();}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}

function ledger(y,mo){

  const book=S.clubs.filter(c=>!isEnc(c)&&!isIt(c)).map(c=>{const ms=S.members.filter(m=>m.club===c.id&&payState(m,y,mo)!=='antes');const b=M.mi.byC[c.id]||{cobrado:0,esperado:0};
    return {nombre:c.nombre,n:ms.length,pag:ms.filter(m=>payState(m,y,mo)==='pagado').length,esp:b.esperado,real:b.cobrado};}).filter(r=>r.n).sort((a,b)=>cmpEs(a.nombre,b.nombre));
  const itOwn=itClubList().filter(c=>!isEnc(c)).map(c=>{const rs=itMems().filter(r=>r.cid===c.id&&pState(r.mem.pagos,r.mem.desde,y,mo)!=='antes');const b=M.it.byC[c.id]||{esp:0,cob:0};
    return {nombre:c.nombre,n:rs.length,pag:rs.filter(r=>(r.mem.pagos||{})[k]==='pagado').length,esp:b.esp,real:b.cob};}).filter(r=>r.n);
  const per=ap=>bmGroups(ap).filter(g=>g.total>0||g.rec>0).map(g=>({nombre:bmName(g.name),clubes:g.rows.map(r=>r.c.nombre).join(', '),esp:g.total,real:g.rec})).sort((a,b)=>cmpEs(a.nombre,b.nombre));
  const bms=per(M.bm), moms=per(M.it);
  const acts=act.list.map(a=>{const c=actCalc(a);return {nombre:a.nombre,fecha:a.fecha,pag:(a.participantes||[]).filter(p=>p.pagado).length,n:(a.participantes||[]).length,esp:actEspOf(a),real:c.cobrado,gasto:c.gastado};});
  const otrosIn=mf.movs.filter(x=>x.tipo==='ingreso'), otrosOut=mf.movs.filter(x=>x.tipo==='egreso');
  const pend=[];
  for(const m of S.members){const c=clubById(m.club);if(!c||isEnc(c)||isIt(c))continue;if(payState(m,y,mo)==='debe')pend.push({nombre:full(m),club:c.nombre,monto:+m.membresia||0});}
  for(const r of itMems()){const c=clubById(r.cid);if(isEnc(c))continue;if(pState(r.mem.pagos,r.mem.desde,y,mo)==='debe')pend.push({nombre:full(r.m),club:c.nombre+' (It)',monto:+r.mem.cuota||0});}
  pend.sort((a,b)=>cmpEs(a.club,b.club)||cmpEs(a.nombre,b.nombre));
  const abonos=S.abonos.filter(a=>a.mes===k&&+a.monto>0).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const V=M.vin, vin=[...V.cli.map(r=>({nombre:'Cliente · '+r.c.nombre,det:r.cob?`Pago mensual cobrado${r.d&&r.d.fecha?' el '+r.d.fecha.split('-').reverse().join('/'):''}`:'Pago mensual pendiente',esp:r.monto,real:r.cob?r.monto:0})),...V.proj.map(p=>({nombre:p.concepto||'Proyecto',det:[p.cliente,p.estado==='cobrado'?'Cobrado':'Pendiente'].filter(Boolean).join(' · '),esp:+p.monto||0,real:p.estado==='cobrado'?+p.monto||0:0}))];
  const ingEsp=M.espMis+M.espBM+M.espIt+M.espVin+acts.reduce((t,a)=>t+a.esp,0)+mf.otrosIn;
  const ingReal=M.realMis+M.realBM+M.realIt+M.realVin+act.ingresos+mf.otrosIn;

}

async function shareFile(file,title){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;console.warn(e);}
  const url=URL.createObjectURL(file); const a=document.createElement('a'); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000); toast('Archivo listo: '+file.name); return true;
}

  let cells=''; for(let i=0;i<lead;i++)cells+='<span class="cd empty"></span>';
  for(let d=1;d<=days;d++){const f=`${mk}-${String(d).padStart(2,'0')}`,n=(byDay[f]||[]).length,its=(byDay[f]||[]).map(e=>{const k=evClub(e);return k?(k.it?'it':'book'):'otro';});
    cells+=`<button class="cd${f===today?' today':''}${f===S.calDay?' sel':''}${n?' has':''}" data-calday="${f}" aria-label="${d} de ${MES[m-1]}${n?`, ${n} ${n===1?'reunión':'reuniones'}`:''}"><span class="n">${d}</span><span class="dots">${its.slice(0,4).map(t=>`<i class="dot ${t}"></i>`).join('')}</span></button>`;}
  const list=S.calDay?(byDay[S.calDay]||[]):inMonth;
  const up=evs.filter(e=>(e.fecha||'')>=today).slice(0,3);
  const selD=S.calDay?new Date(+S.calDay.slice(0,4),+S.calDay.slice(5,7)-1,+S.calDay.slice(8,10)):null;
  return `
  ${up.length?`<section class="panel" style="margin-bottom:14px"><div class="sec-head" style="margin-top:0"><h2>Próximas</h2><span class="muted">${evs.filter(e=>(e.fecha||'')>=today).length} en total</span></div><div class="evlist">${up.map(e=>evCard(e,true)).join('')}</div></section>`:''}
  <section class="panel cal">
    <div class="calhead"><button class="btn small" data-calnav="-1" aria-label="Mes anterior">‹</button><h2>${MES[m-1]} ${y}</h2><button class="btn small" data-calnav="1" aria-label="Mes siguiente">›</button>${mk!==curKey?'<button class="btn small" data-calnav="0">Hoy</button>':''}</div>
    <div class="calgrid">${DIAS.map(d=>`<span class="dw">${d}</span>`).join('')}${cells}</div>
    <div class="legend" style="margin-top:10px"><span><i class="dot book"></i> The Book Club</span><span><i class="dot it"></i> The It Club</span><span><i class="dot otro"></i> Otro evento</span></div>
  </section>
  <div class="sec-head" style="margin-top:20px"><h2>${selD?`${DIAS_L[selD.getDay()][0].toUpperCase()+DIAS_L[selD.getDay()].slice(1)} ${selD.getDate()} de ${MES[m-1].toLowerCase()}`:`Reuniones de ${MES[m-1].toLowerCase()}`}</h2>
    <span style="display:flex;gap:8px;align-items:center">${S.calDay?'<button class="btn small" data-calday="">Ver todo el mes</button>':''}<span class="muted">${list.length} ${list.length===1?'reunión':'reuniones'}</span></span></div>
  ${list.length?`<div class="evlist">${list.map(e=>evCard(e,!S.calDay)).join('')}</div>`:`<div class="panel empty">${S.calDay?'No hay nada este día.':'No hay reuniones este mes.'}${S.canWrite?` <button class="btn small primary" data-evnew="${esc(S.calDay||'')}">+ Agregar</button>`:''}</div>`}`;
}
function openEvento(id,fecha){
  const e=id?S.eventos.find(x=>x.id===id):null; if(id&&!e)return;
  const v=e||{club:'',titulo:'',fecha:fecha||S.calDay||(mkey(S.calY,S.calM)===curKey?todayStr():mkey(S.calY,S.calM)+'-01'),hora:'',lugar:'',notas:''};
  const book=scopeClubs(), it=itClubList();
  const opt=c=>`<option value="${esc(c.id)}"${c.id===v.club?' selected':''}>${esc(isIt(c)?itLabel(c.id):clubLabel(c.id))}</option>`;
  const lugares=[...new Set(S.eventos.map(x=>(x.lugar||'').trim()).filter(Boolean))].sort(cmpEs);
  showModal(`
    <div class="head"><h2>${e?'Editar reunión':'Nueva reunión'}</h2><button class="btn small" id="e-close" type="button">Cerrar</button></div>
    <form id="e-form" class="form" novalidate>
      <label class="full" id="lb-ec">Club<select id="e-club"><option value="">— Otro evento (sin club) —</option>${book.length?`<optgroup label="The Book Club">${book.map(opt).join('')}</optgroup>`:''}${it.length?`<optgroup label="The It Club">${it.map(opt).join('')}</optgroup>`:''}</select></label>
      <label class="full" id="lb-et"><span id="e-tl">${v.club?'Título (opcional)':'Nombre del evento *'}</span><input type="text" id="e-tit" value="${esc(v.titulo||'')}" placeholder="Ej. Reunión de noviembre"></label>
      <label id="lb-ef">Fecha *<input type="date" id="e-fecha" value="${esc(v.fecha||'')}"></label>
      <label>Hora<input type="time" id="e-hora" value="${esc(v.hora||'')}"></label>
      <label class="full">Sitio de la reunión<input type="text" id="e-lugar" list="e-lugares" value="${esc(v.lugar||'')}" placeholder="Ej. Café del centro"><datalist id="e-lugares">${lugares.map(l=>`<option value="${esc(l)}"></option>`).join('')}</datalist></label>
      <label class="full">Notas (opcional)<input type="text" id="e-notas" value="${esc(v.notas||'')}" placeholder="Ej. Llevar marcapáginas"></label>
      <p class="formerr full" id="e-err" hidden></p>
      <div class="foot full">${e?'<button class="btn danger" type="button" id="e-del">Eliminar</button>':''}<div class="r"><button class="btn" type="button" id="e-cancel">Cancelar</button><button class="btn primary" type="submit">${e?'Guardar':'Agregar'}</button></div></div>
    </form>`,()=>{
      $('#e-close').onclick=closeModal;$('#e-cancel').onclick=closeModal;
      $('#e-club').onchange=()=>{$('#e-tl').textContent=$('#e-club').value?'Título (opcional)':'Nombre del evento *';};
      const del=$('#e-del'); if(del) del.onclick=()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Confirmar: eliminar';return;}
        closeModal(); S.eventos=S.eventos.filter(x=>x.id!==e.id); render(); write('eventos/'+e.id,()=>S.db.doc('eventos/'+e.id).delete()).then(()=>toast('Reunión eliminada')).catch(()=>{});};
      $('#e-form').onsubmit=ev=>{ev.preventDefault();
        const club=$('#e-club').value, titulo=$('#e-tit').value.trim(), fecha=$('#e-fecha').value;
        $('#lb-ef').classList.toggle('err',!fecha); $('#lb-et').classList.toggle('err',!club&&!titulo);
        if(!fecha||(!club&&!titulo)){const er=$('#e-err');er.hidden=false;er.textContent=!fecha?'Elige la fecha.':'Elige un club o escribe el nombre del evento.';return;}
        const body={club,titulo,fecha,hora:$('#e-hora').value,lugar:$('#e-lugar').value.trim(),notas:$('#e-notas').value.trim()};
        const nid=e?e.id:S.db.collection('eventos').doc().id; if(!e)body.creado=new Date().toISOString();
        S.eventos=[...S.eventos.filter(x=>x.id!==nid),{id:nid,...(e||{}),...body}]; S.calY=+fecha.slice(0,4); S.calM=+fecha.slice(5,7); closeModal(); render();
        write('eventos/'+nid,()=>e?S.db.doc('eventos/'+nid).update(body):S.db.doc('eventos/'+nid).set(body)).then(()=>toast(e?'Reunión actualizada':'Reunión agregada')).catch(()=>{});
      };
      setTimeout(()=>$('#e-club').focus(),30);
    });
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b)return; const d=b.dataset;
  if(d.calnav!==undefined){const n=+d.calnav; if(n===0){S.calY=CUR_Y;S.calM=CUR_M;S.calDay=todayStr();}else{let m=S.calM+n,y=S.calY;if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.calY=y;S.calM=m;S.calDay='';} render(); return;}
  if(d.calday!==undefined){S.calDay=(d.calday&&d.calday===S.calDay)?'':d.calday; render(); return;}
  if(d.evedit){openEvento(d.evedit);return;}
  if(d.evnew!==undefined){openEvento(null,d.evnew||null);return;}
});

/* ---------- Respaldo ---------- */
function vRespaldo(){
  const c=LocalDB.counts(), last=(()=>{try{return localStorage.getItem('cl-last-backup')}catch(e){return null}})();
  const days=last?Math.floor((Date.now()-new Date(last))/864e5):null;
  return `<div class="grid respaldo" style="gap:14px">
  ${LocalDB.isEmpty()?`<section class="panel"><h2>Bienvenida 📚</h2><p class="hint">Esta app guarda todo solo en este teléfono. Para empezar con tus datos, toca <b>Restaurar</b> y elige el archivo de copia de seguridad (.json).</p></section>`:''}
  <section class="panel">
    <h2>Copia de seguridad</h2>
    <p class="hint">Crea un archivo .json con todos tus datos. Guárdalo en Archivos o iCloud Drive, o envíatelo por WhatsApp o correo. Hazlo seguido: si borras la app o cambias de teléfono, solo la copia te devuelve los datos.</p>
    <p style="margin:10px 0 0">${last?`Última copia: <b>${esc(new Date(last).toLocaleDateString('es-VE',{day:'numeric',month:'long',year:'numeric'}))}</b>${days>=7?` <span class="pill warn">hace ${days} días</span>`:''}`:'<span class="pill warn">Todavía no has hecho ninguna copia en este teléfono</span>'}</p>
    <div class="acts-row"><button class="btn green big" data-backup="1"${LocalDB.isEmpty()?' disabled':''}>Hacer copia de seguridad</button></div>
  </section>
  <section class="panel">
    <h2>Restaurar</h2>
    <p class="hint">Carga un archivo de copia de seguridad. Reemplaza <b>todos</b> los datos que hay ahora en este teléfono por los del archivo.</p>
    <div class="acts-row"><label class="btn primary big filebtn" for="restore-file">Elegir archivo y restaurar</label><input type="file" id="restore-file" hidden></div>
  </section>
  <section class="panel">
    <h2>En este teléfono</h2>
    <div class="counts"><div><b>${c.members||0}</b>chicas</div><div><b>${c.clubs||0}</b>clubes</div><div><b>${c.activities||0}</b>actividades</div><div><b>${c.eventos||0}</b>reuniones y eventos</div><div><b>${c.abonos||0}</b>abonos</div><div><b>${c.tasas||0}</b>tasas BCV</div><div><b>${c.vincci||0}</b>registros Vincci</div></div>
    <p class="hint" style="margin-top:10px">Versión de la app: <span id="app-ver">${esc(window.__APPVER||'—')}</span></p>
  </section></div>`;
}
async function doBackup(){
  const data=LocalDB.exportAll(), d=todayStr();
  const file=new File([JSON.stringify(data,null,1)],`club-de-lectura-${d}.json`,{type:'application/json'});
  const ok=await shareFile(file,'Copia del Club de Lectura');
  if(ok){try{localStorage.setItem('cl-last-backup',new Date().toISOString());}catch(e){} render();}
}
function askRestore(obj,fname){
  const d=obj&&obj.data||{}, n=o=>Object.keys(o||{}).length, cur=LocalDB.counts();
  showModal(`<div class="head"><h2>Restaurar copia</h2><button class="btn small" id="r-close" type="button">Cerrar</button></div>
    <p style="margin:0">Archivo: <b>${esc(fname)}</b>${obj.exportado?`<br><span class="muted">creado el ${esc(new Date(obj.exportado).toLocaleString('es-VE'))}</span>`:''}</p>
    <div class="counts"><div><b>${n(d.members)}</b>chicas</div><div><b>${n(d.clubs)}</b>clubes</div><div><b>${n(d.activities)}</b>actividades</div><div><b>${n(d.abonos)}</b>abonos</div></div>
    ${LocalDB.isEmpty()?'':`<p class="warnbox">Se van a reemplazar los datos actuales del teléfono (${cur.members||0} chicas, ${cur.clubs||0} clubes). Si no estás seguro, haz primero una copia de seguridad.</p>`}
    <div class="foot"><div class="r"><button class="btn" type="button" id="r-cancel">Cancelar</button><button class="btn primary" type="button" id="r-ok">Restaurar ahora</button></div></div>`,()=>{
      $('#r-close').onclick=closeModal;$('#r-cancel').onclick=closeModal;
      $('#r-ok').onclick=()=>{try{LocalDB.importAll(obj);try{localStorage.setItem('cl-sec','clubes');}catch(e){} location.reload();}catch(e){toast(e.message||'No se pudo restaurar');}};
    });
}
document.addEventListener('change',e=>{
  const t=e.target; if(t.id!=='restore-file'||!t.files||!t.files[0]) return;
  const f=t.files[0]; const rd=new FileReader();
  rd.onload=()=>{let obj;try{obj=JSON.parse(rd.result);}catch(err){toast('Ese archivo no es una copia válida (.json)');return;}
    if(!obj||!obj.data){toast('Ese archivo no es una copia del Club de Lectura');return;} askRestore(obj,f.name);};
  rd.onerror=()=>toast('No se pudo leer el archivo'); rd.readAsText(f); t.value='';
});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-backup]');if(b&&!b.disabled)doBackup();});
window.addEventListener('localdb-error',()=>toast('El teléfono no tiene espacio para guardar. Haz una copia y libera espacio.'));
/* ---------- Tasa BCV automática ---------- */
async function autoTasa(){
  if(!navigator.onLine||!S.db) return; const today=todayStr();
  try{if(localStorage.getItem('cl-tasa-try')===today)return;localStorage.setItem('cl-tasa-try',today);}catch(e){}
  try{
    const get=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
    const [d,e]=await Promise.all([get('https://ve.dolarapi.com/v1/dolares/oficial'),get('https://ve.dolarapi.com/v1/euros/oficial')]);
    const usd=+(d.promedio||d.venta), eur=+(e.promedio||e.venta); if(!(usd>0&&eur>0)) return;
    const ts=new Date(d.fechaActualizacion||Date.now()); const f=`${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}-${String(ts.getDate()).padStart(2,'0')}`;
    const ex=S.tasas.find(t=>t.fecha===f); if(ex&&(ex.manual||(+ex.eur===eur&&+ex.usd===usd))) return;
    await S.db.doc('tasas/'+f).set({fecha:f,eur,usd,fuente:'BCV (vía DolarApi)',manual:false,actualizado:new Date().toISOString()});
  }catch(err){console.warn('No se pudo actualizar la tasa',err);try{localStorage.removeItem('cl-tasa-try');}catch(e){}}
}
/* ---------- Service worker: funciona sin internet y se actualiza solo ---------- */
if('serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller; let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.version){window.__APPVER=e.data.version;const v=document.getElementById('app-ver');if(v)v.textContent=e.data.version;}});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const activate=w=>{if(w)w.postMessage('skipWaiting');};
      if(reg.waiting)activate(reg.waiting);
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)activate(nw);});});
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
      const ask=()=>{const c=navigator.serviceWorker.controller||reg.active;if(c)c.postMessage('version');};ask();navigator.serviceWorker.ready.then(ask);
    }).catch(e=>console.warn('SW',e));
  });
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- boot ---------- */
render();
(async()=>{
  const db=window.LocalDB;
  if(!db){$('#sub').textContent='';$('#view').innerHTML='<div class="status">No se pudo abrir el almacenamiento del teléfono.</div>';return;}
  if(db.isEmpty()) S.section='respaldo';
  S.db=db;
  const onErr=e=>{console.error(e);$('#view').innerHTML='<div class="status">No se pudieron leer los datos. Cierra y vuelve a abrir la app.</div>';};
  db.collection('clubs').onSnapshot(s=>{S.clubs=s.docs.map(d=>{const o={id:d.id,...d.data()};const p=pendingClub[d.id];if(p)for(const [f,v] of Object.entries(p))o[f]=(v&&typeof v==='object')?{...(o[f]||{}),...v}:v;return o;}).sort((a,b)=>cmpEs(a.nombre,b.nombre));S.ready.clubs=true;render();},onErr);
  db.collection('members').onSnapshot(s=>{S.allMembers=s.docs.map(d=>({id:d.id,...d.data()}));S.members=S.allMembers.filter(m=>m.club);S.ready.members=true;render();},onErr);
  db.collection('books').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.books=o;render();},onErr);
  db.collection('activities').onSnapshot(s=>{S.acts=s.docs.map(d=>({id:d.id,...(pendingAct[d.id]||d.data())}));render();},onErr);
  db.collection('tasas').onSnapshot(s=>{S.tasas=s.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha));render();},onErr);
  db.collection('abonos').onSnapshot(s=>{S.abonos=s.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
  db.collection('eventos').onSnapshot(s=>{S.eventos=s.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
  db.collection('vincci').onSnapshot(s=>{S.vincci=s.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
  db.collection('movs').onSnapshot(s=>{S.movs=s.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
  db.doc('config/general').onSnapshot(s=>{if(s.exists){S.config={precioLibro:15,...s.data(),...(cfgPending||{})};LEADER=S.config.lider||'Yo';const p=document.getElementById('f-price');if(!p||document.activeElement!==p)render();}},onErr);
  setTimeout(autoTasa,1200);
})();
})();
</script>
